name: Secure Pipeline scans - Day 4

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Day4/**'              
  pull_request:
    branches:
      - main 
      - master 
    paths:
      - 'Day4/**'

jobs:
  sast_scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: Day4

      - name: Run Bandit (Python SAST)
        id: bandit
        run: |
          pip install bandit
          bandit -r . -f html -o bandit-report.html || true
        working-directory: Day4
        shell: bash
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Day4/bandit-report.html

      - name: Run Semgrep (Default Behavior)
        id: semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --json --output=semgrep-report.json || true
        working-directory: Day4
        shell: bash
        continue-on-error: true

      - name: Upload Semgrep Json Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-report
          path: Day4/semgrep-report.json

  trivy_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
            scan-type: fs
            format: json
            output: Day4/trivy-report.json
            ignore-unfixed: true
            vuln-type: "os,library"
        continue-on-error: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Day4/trivy-report.json

  dast_scan:
    runs-on: ubuntu-latest
    needs: [sast_scans, trivy_scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: Day4

      - name: Start Flask App
        run: |
          nohup python app.py > app.log 2>&1 &
          echo "Waiting for app to start..."
          for i in {1..10}; do
            curl --fail http://localhost:5000 && break
            echo "Waiting for Flask..."
            sleep 3
          done
        working-directory: Day4
        shell: bash

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- App failed to start. Displaying logs from app.log: ---"
          cat app.log
        working-directory: Day4

      # 8️⃣ Runtime security stage: OWASP ZAP scan using Docker (reports written to Day4/)
      - name: Run ZAP Baseline Scan via Docker
        continue-on-error: true
        run: |
          sudo chown -R 1000:1000 ${{ github.workspace }}
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "${{ github.workspace }}/Day4":/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://host.docker.internal:5000/ \
            -g gen.conf \
            -J /zap/wrk/report_json.json \
            -w /zap/wrk/report_md.md \
            -r /zap/wrk/report_html.html
        shell: bash

      - name: Upload ZAP DAST Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            Day4/report_json.json
            Day4/report_md.md
            Day4/report_html.html
