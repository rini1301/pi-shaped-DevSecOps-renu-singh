name: CI/CD DevSecOps Pipeline - Day 4

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  devsecops-scans:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Build stage: Install dependencies
      - name: Install dependencies
        run: |
          cd Day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep

      # 4️⃣ Static security stage: Bandit scan
      - name: Bandit scan
        run: |
          cd Day4
          bandit -r . -f html -o bandit-report.html || true
        continue-on-error: true

      # 5️⃣ Static security stage: Semgrep scan
      - name: Semgrep scan
        run: |
          cd Day4
          semgrep --config .semgrep.yml --sarif --output semgrep-report.sarif || true
        continue-on-error: true

      # 6️⃣ Dependency security stage: Trivy scan
      - name: Trivy scan
        run: |
          cd Day4
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b ./bin
          sudo mv ./bin/trivy /usr/local/bin/
          trivy fs . --format json --output trivy-report.json || true
        continue-on-error: true

      # 7️⃣ Runtime security stage: Start Flask app
      - name: Start Flask App
        run: |
          cd Day4
          nohup python app.py > app.log 2>&1 &
          echo "Waiting for Flask server..."
          for i in {1..10}; do
            curl -s http://localhost:5000 > /dev/null && break
            echo "Flask not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Flask server is up!"
        continue-on-error: true

      # 8️⃣ Runtime security stage: OWASP ZAP scan
      - name: OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-r zap-report.html -w report_md.md -J report_json.json -I"
        continue-on-error: true

      # 9️⃣ Upload all scan reports as CI/CD artifacts
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            Day4/bandit-report.html
            Day4/semgrep-report.sarif
            Day4/trivy-report.json
            zap-report.html
            report_md.md
            report_json.json
