name: CI/CD DevSecOps Pipeline - Day 4

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  devsecops-scans:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd Day4
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      # 4️⃣ Bandit scan
      - name: Bandit scan
        run: |
          cd Day4
          bandit -r . -f html -o bandit-report.html
        continue-on-error: true

      # 5️⃣ Semgrep scan
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "Day4/.semgrep.yml"
          args: "--sarif --output Day4/semgrep-report.sarif"
        continue-on-error: true

      # 6️⃣ Trivy scan
      - name: Trivy scan
        run: |
          cd Day4
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b ./bin
          sudo mv ./bin/trivy /usr/local/bin/
          trivy fs . --format json --output trivy-report.json
        continue-on-error: true

      # 7️⃣ Start Flask app
      - name: Start Flask App
        run: |
          cd Day4
          nohup python app.py &
          echo "Waiting for Flask server to start..."
          until curl -s http://localhost:5000 > /dev/null; do
            echo "Flask not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Flask server is up!"
        continue-on-error: true

      # 8️⃣ OWASP ZAP scan
      - name: OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-r zap-report.html -t -f"

      # 9️⃣ Upload scan reports
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            Day4/bandit-report.html
            Day4/semgrep-report.sarif
            Day4/trivy-report.json
            zap-report.html
