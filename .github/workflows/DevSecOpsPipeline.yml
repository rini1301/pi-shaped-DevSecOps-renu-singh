# 7️⃣ Runtime security stage: Start Flask app
- name: Start Flask App
  run: |
    cd Day4
    # Start Flask app on all interfaces
    nohup python app.py &
    # Wait until the app is responding
    echo "Waiting for Flask server to start..."
    until curl -s http://localhost:5000 > /dev/null; do
      echo "Flask not ready yet, waiting 2s..."
      sleep 2
    done
    echo "Flask server is up!"

# 8️⃣ Runtime security stage: OWASP ZAP scan
- name: OWASP ZAP scan
  uses: zaproxy/action-full-scan@v0.9.0
  with:
    target: "http://localhost:5000"
    cmd_options: "-r zap-report.html -t -f"  # -t: continue on alerts, -f: full scan
